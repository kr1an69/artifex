server.port=8080
server.address=0.0.0.0

# Database MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/artifex_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:iwillwin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Import file .env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../.env[.properties]
# Cau hinh TextBee SMS Gateway de gui SMS OTP ve so dien thoai that
sms.textbee.device-id=${TEXTBEE_DEVICE_ID:}
sms.textbee.api-key=${TEXTBEE_API_KEY:}
# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}