server.port=8080
server.address=0.0.0.0

# Database MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/artifex_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=iwillwin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Import file .env cuc bo neu co (file .env duoc .gitignore bao ve, khong bao gio bi day len GitHub)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:../.env[.properties]

# Cau hinh TextBee SMS Gateway de gui SMS OTP ve so dien thoai that (Bao mat qua bien moi truong hoac .env)
sms.textbee.device-id=${TEXTBEE_DEVICE_ID:}
sms.textbee.api-key=${TEXTBEE_API_KEY:}
