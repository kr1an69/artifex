server.port=8080

# Database MySQL configuration
spring.datasource.url=jdbc:mysql://localhost:3306/artifex_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:iwillwin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo_cloudinary_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo_cloudinary_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo_cloudinary_secret}
